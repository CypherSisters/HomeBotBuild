# Drop-in override for the unit shipped by the official Ollama installer.
# We do NOT ship our own ollama.service — `curl -fsSL https://ollama.com/install.sh | sh`
# creates and enables one, and it already handles the Jetson CUDA runtime.
#
# Install:
#   sudo install -D -m 0644 systemd/ollama.service.d/override.conf \
#       /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Only two things actually need overriding on the Orin; everything else is
# left to the installer's defaults.

[Service]
# 1. Models must live on the NVMe. The dev kit's 64 GB eMMC cannot hold a
#    20-30B MoE plus the 7B fast path plus ChromaDB plus the ZIM library.
Environment="OLLAMA_MODELS=/data/puffpai/models/ollama"

# 2. LOOPBACK ONLY. Ollama has NO authentication of any kind: anything that
#    can open a TCP connection to this port can run the household's model,
#    read the model list, and push or delete models. This appliance ships
#    with no host packet filter, so a non-loopback bind is reachable by every
#    device on the home network — including a guest phone or a compromised
#    smart TV.
#
#    Everything that must reach Ollama runs on this host: the backend
#    (puffpai-api), the voice service and the CLI all use
#    http://localhost:11434.
#
#    The one caller that CANNOT is the Node-RED container's optional
#    `health_check` flow, which probes OLLAMA_URL/api/tags over the docker
#    bridge (host.docker.internal). With this loopback bind that single probe
#    reports Ollama unreachable; nothing else degrades, and no automation
#    depends on it. If you want that tile green, read — and accept the
#    trade-off in — 20-lan-ollama.conf.example in this directory.
Environment="OLLAMA_HOST=127.0.0.1:11434"

# Optional: keep the resident model loaded between requests so voice replies
# do not pay a cold-start. Tune it against your own workload.
#Environment="OLLAMA_KEEP_ALIVE=30m"
