# Fail the HA token closed, once it is safe to.
#
# DO NOT INSTALL THIS FILE UNTIL THE MIGRATION HAS RUN AND BEEN VERIFIED.
# The precondition is recorded here, next to the change, so the file cannot
# be installed without reading it.
#
# What it does: turns off the plaintext fallback in
# src/puffpai/security/ha_token_source.py / ha_vault.py. With the fallback off,
# the token source returns None instead of reading the long-lived token out of
# config/home_assistant_config.json when nothing else resolved it.
#
# Why it is not on by default: on an appliance that has not run the migration,
# the token exists ONLY in that plaintext file. Setting this then does not
# protect anything -- it just fails Home Assistant closed while the plaintext
# token is still on disk.
#
# The order, all of it, and in this order:
#
#   1. ROOT installs the machine-bound service key and takes the one rollback
#      copy of the config:
#
#        sudo /opt/puffpai/scripts/install_vault_service_key.sh --dry-run
#        sudo /opt/puffpai/scripts/install_vault_service_key.sh
#        sudo systemctl restart puffpai-api
#
#   2. The OWNER runs the migration, which needs their PIN -- the vault data
#      key is wrapped only under the PIN and the recovery code, so nobody else
#      can.
#
#      NOTE THE INVOCATION. The migration must run AS puffpai (it writes the
#      vault keyring, the vault record and the HA config; as root it would
#      leave root-owned files the service can no longer write). But the machine
#      key is 0600 root:root by design, so a plain `sudo -u puffpai` run cannot
#      read it, cannot enroll the service wrap, and would leave the appliance
#      with no unattended boot path WHILE LOOKING LIKE IT WORKED. systemd-run
#      is the bridge: the transient unit is handed the credential exactly the
#      way this service is, and --pty gives getpass a terminal for the PIN.
#
#        sudo systemd-run --pty --wait --collect \
#          --uid=puffpai --gid=puffpai \
#          --property=LoadCredential=puffpai-vault-service-key:/etc/puffpai/vault_service.key \
#          --setenv=PYTHONPATH=/opt/puffpai/src \
#          /opt/puffpai/venv/bin/python \
#          /opt/puffpai/scripts/migrate_ha_token.py --dry-run
#
#      then the same command without --dry-run, then with --scrub. The script
#      REFUSES to scrub unless it has first read the token back the way the
#      appliance will and got HTTP 200 from Home Assistant with it.
#
#      While the migration runs, nobody should change the PIN or generate a
#      recovery code -- both rewrite the same keyring.
#
#   3. Verify: GET /system/status shows
#        "home_assistant": {"status": "ready", "token_source": "vault-service"}
#      and `grep MIGRATED_TO_VAULT /opt/puffpai/config/home_assistant_config.json`
#      matches.
#
#   4. ONLY THEN install this file:
#
#        sudo install -D -m 0644 \
#          /opt/puffpai/systemd/puffpai-api.service.d/20-ha-token-failclosed.conf \
#          /etc/systemd/system/puffpai-api.service.d/20-ha-token-failclosed.conf
#        sudo systemctl daemon-reload && sudo systemctl restart puffpai-api
#
#   5. Reboot once, with nobody logged in, and confirm Home Assistant still
#      works. Then delete the rollback copy.
#
# To revert: remove this file, daemon-reload, restart. The fallback is on by
# default in code, so removing this drop-in restores the previous behaviour.
[Service]
Environment=PUFFPAI_ALLOW_PLAINTEXT_HA_TOKEN_FALLBACK=0
