# Let puffpai-api reach the PulseAudio socket so "turn the volume up" works.
#
# The unit sets ProtectHome=true, which bind-mounts /run/user to systemd's
# inaccessible dir, so without this pactl inside the service fails with
# "Connection refused" and every volume command answers "I couldn't reach the
# speaker mixer".
#
# This exposes ONLY /run/user/1000/pulse (the socket directory), not /home,
# not /root, not the rest of /run/user. The service already drives these same
# speakers -- it spawns the mpv radio container -- so this grants no capability
# it did not effectively have; it just lets it set the level as well as play.
#
# ALSA is deliberately NOT used instead: PulseAudio owns this sink's hardware
# mixer (HW_VOLUME_CTRL), and a direct amixer setting is snapped back to 100%%
# the next time Pulse touches volume.
#
# The leading '-' makes the source optional, so the service still starts if the
# user session (and therefore the socket) is not up yet at boot.
[Service]
BindPaths=-/run/user/1000/pulse
