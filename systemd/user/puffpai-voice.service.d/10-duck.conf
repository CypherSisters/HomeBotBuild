# Barge-in ducking policy.
#
# The music dips only when someone is talking to the assistant, not when
# people sing along or talk near it.
#
# WHY NOT DUCK ON THE WAKE TRIGGER: the wake model is a SPEECH detector, not a
# name detector. Ducking the instant it fires, before transcribing and before
# knowing whether anyone addressed it, dips the music for every stretch of
# room speech: dozens of 2-3 s dips an hour against a handful of genuinely
# addressed turns.
#
# THE POLICY (puffpai/voice/ducking.py):
#   listening       -> no duck at all. An un-addressed utterance changes
#                      nothing audible, ever.
#   addressed       -> duck to PUFF_DUCK_ADDRESSED_LEVEL for the whole
#                      exchange: the spoken reply and, if PUFF_FOLLOWUP=1, the
#                      8 s hands-free window. Restored when it ends.
#   missed wake     -> if an un-addressed pass looked like a wake we mis-heard
#                      over playback (empty / low-confidence transcript, or a
#                      name fragment too late in the utterance to parse) AND
#                      something is playing, arm a peek for
#                      PUFF_DUCK_PEEK_ARM seconds. The NEXT wake trigger inside
#                      that window ducks to the lighter PUFF_DUCK_PEEK_LEVEL
#                      before recording, so the repeat is captured cleanly.
#                      Without it, waking over loud music fails: ducking only
#                      after the address check leaves the wake name buried.
#
# WHY A PEEK IS ENOUGH: the ReSpeaker XVF3800 is both the Pulse sink and the
# capture source, so its AEC far-end reference is wired by hardware topology --
# the mic barely hears our own Pulse-routed playback (jazz at 100%: mic RMS
# p50=25 vs WAKE_GATE 150). Ducking is not needed for far-end rejection;
# only for double-talk, where a light dip suffices.
#
# LEVERS
#   PUFF_DUCK_ADDRESSED_LEVEL  deep dip, addressed exchanges        (default 45)
#   PUFF_DUCK_PEEK_LEVEL       light dip, peek retries              (default 70)
#   PUFF_DUCK_PEEK_ARM         seconds a peek stays armed           (default 20)
#   PUFF_DUCK_ON_LISTEN        1 = duck on EVERY wake trigger, at the peek
#                              level. Dips the music for room speech too.
#                              Default 0.
#   PUFF_STT_WEAK_LOGPROB      transcripts at/below this mean avg_logprob count
#                              as "probably mis-heard"              (default -0.8)
#   PUFF_DUCK_PCT              LEGACY name for the addressed level; still
#                              honoured if set. Prefer the explicit names
#                              above.
#
# Always-duck behaviour: PUFF_DUCK_ON_LISTEN=1.
# To use the code defaults instead: delete this file, daemon-reload, restart
# the user unit.
[Service]
Environment=PUFF_DUCK_ADDRESSED_LEVEL=45
Environment=PUFF_DUCK_PEEK_LEVEL=70
Environment=PUFF_DUCK_ON_LISTEN=0
