<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="/vendor/fonts/fonts.css" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<meta name="description" content="Local-first AI family calendar, task manager, medication tracker, and bill organizer.">
<style>
/*═══════════════════════════════════════════════════════════════
  FRUTIGER AERO × NEXT-GEN AI — PuffPAI Design System
  Translucent glass over deep ocean. Nature meets technology.
  Bubbles, light bloom, organic greens, sky blues, warm golds.
═══════════════════════════════════════════════════════════════*/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  /* ── Deep Ocean Base ─────────────── */
  --ocean-void:#040a14;
  --ocean-deep:#060d18;
  --ocean-mid:#0c1829;
  --ocean-surface:#122240;
  --ocean-shallow:#1a3055;

  /* ── Sky Blues (Frutiger Aero) ───── */
  --sky-bright:#38bdf8;
  --sky-vivid:#0ea5e9;
  --sky-deep:#0284c7;
  --sky-glow:rgba(56,189,248,0.15);
  --sky-ghost:rgba(56,189,248,0.06);

  /* ── Organic Greens ─────────────── */
  --leaf-bright:#4ade80;
  --leaf-vivid:#22c55e;
  --leaf-deep:#16a34a;
  --leaf-glow:rgba(74,222,128,0.15);

  /* ── Warm Golds ─────────────────── */
  --sun-bright:#fbbf24;
  --sun-vivid:#f59e0b;
  --sun-glow:rgba(251,191,36,0.15);

  /* ── Bloom Accents ──────────────── */
  --bloom-rose:#fb7185;
  --bloom-rose-glow:rgba(251,113,133,0.15);
  --bloom-violet:#a78bfa;
  --bloom-violet-glow:rgba(167,139,250,0.15);
  --bloom-aqua:#22d3ee;
  --bloom-aqua-glow:rgba(34,211,238,0.12);

  /* ── Glass System ───────────────── */
  --glass-bg:rgba(8,18,38,0.55);
  --glass-bg-solid:rgba(10,22,45,0.82);
  --glass-border:rgba(56,189,248,0.12);
  --glass-border-hover:rgba(56,189,248,0.28);
  --glass-shine:rgba(255,255,255,0.04);
  --glass-blur:16px;

  /* ── Text ────────────────────────── */
  --text-bright:#e8f4fd;
  --text-mid:#94b8d4;
  --text-dim:#5a7a96;
  --text-ghost:#3a5570;
  --text-dark:#060d18;

  /* ── Spacing & Radii ────────────── */
  --gap:14px;
  --r:14px;
  --r-sm:8px;
  --r-lg:20px;
  --r-xl:28px;

  /* ── Fonts ───────────────────────── */
  --f-display:'Exo 2',sans-serif;
  --f-body:'Nunito',sans-serif;
  --f-mono:'Fira Code',monospace;

  /* ── Shadows ─────────────────────── */
  --sh-sm:0 2px 12px rgba(0,0,0,0.35);
  --sh-md:0 6px 32px rgba(0,0,0,0.45);
  --sh-lg:0 12px 56px rgba(0,0,0,0.55);
  --sh-glow-sky:0 0 40px rgba(56,189,248,0.12),0 0 80px rgba(56,189,248,0.06);
  --sh-glow-leaf:0 0 40px rgba(74,222,128,0.12);
  --sh-glow-sun:0 0 40px rgba(251,191,36,0.10);
}

html{font-size:13.5px;scroll-behavior:smooth}
body{
  font-family:var(--f-body);
  background:var(--ocean-void);
  color:var(--text-bright);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ── FRUTIGER AERO BACKGROUND ────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    /* Deep ocean gradient base */
    linear-gradient(175deg, #040a14 0%, #071428 30%, #0a1e3d 55%, #0c2545 75%, #081a30 100%),
    /* Underwater light caustics */
    radial-gradient(ellipse 120% 80% at 15% 0%, rgba(56,189,248,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 80% 100% at 85% 15%, rgba(34,211,238,0.05) 0%, transparent 50%),
    /* Green nature glow from bottom */
    radial-gradient(ellipse 100% 50% at 50% 110%, rgba(74,222,128,0.04) 0%, transparent 60%),
    /* Sun bloom top-right */
    radial-gradient(circle at 88% 8%, rgba(251,191,36,0.04) 0%, transparent 35%);
}

/* Floating bubble particles - Frutiger Aero signature */
body::after{
  content:'';position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(circle 180px at 12% 25%, rgba(56,189,248,0.025) 0%, transparent 70%),
    radial-gradient(circle 120px at 78% 65%, rgba(74,222,128,0.02) 0%, transparent 70%),
    radial-gradient(circle 90px at 45% 80%, rgba(167,139,250,0.02) 0%, transparent 70%),
    radial-gradient(circle 60px at 90% 20%, rgba(251,191,36,0.02) 0%, transparent 70%),
    radial-gradient(circle 200px at 30% 50%, rgba(34,211,238,0.015) 0%, transparent 70%);
}

::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ocean-shallow);border-radius:3px}

/* ── APP SHELL ───────────────────────────────────────────── */
.shell{
  display:grid;
  grid-template-columns:64px 1fr;
  grid-template-rows:56px 1fr;
  min-height:100vh;
  position:relative;z-index:2;
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
.side{
  grid-row:1/-1;
  background:var(--glass-bg-solid);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--glass-border);
  display:flex;flex-direction:column;align-items:center;
  padding:14px 0;gap:4px;
  position:relative;
}
.side::after{
  content:'';position:absolute;right:0;top:15%;height:70%;width:1px;
  background:linear-gradient(transparent,var(--sky-glow),rgba(74,222,128,0.1),transparent);
}

.logo{
  width:38px;height:38px;border-radius:var(--r);
  background:linear-gradient(135deg,var(--sky-vivid),var(--leaf-vivid));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:800;font-size:15px;
  color:white;margin-bottom:18px;position:relative;
  box-shadow:0 0 24px rgba(56,189,248,0.25),0 0 48px rgba(74,222,128,0.1);
}
.logo::before{
  content:'';position:absolute;inset:-2px;border-radius:16px;
  background:linear-gradient(135deg,var(--sky-bright),var(--leaf-bright));
  opacity:0.25;filter:blur(6px);z-index:-1;
}

.nbtn{
  width:40px;height:40px;border-radius:var(--r-sm);border:none;
  background:transparent;color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;font-size:17px;position:relative;
}
.nbtn:hover{background:var(--sky-ghost);color:var(--text-mid)}
.nbtn.on{color:var(--sky-bright);background:var(--sky-glow)}
.nbtn.on::before{
  content:'';position:absolute;left:-12px;width:3px;height:20px;
  background:linear-gradient(var(--sky-bright),var(--leaf-bright));
  border-radius:0 3px 3px 0;
}
.nfill{flex:1}

/* ── TOPBAR ──────────────────────────────────────────────── */
.top{
  background:var(--glass-bg-solid);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--glass-border);
  padding:0 24px;display:flex;align-items:center;gap:16px;
}
.top-brand{
  font-family:var(--f-display);font-size:13px;font-weight:700;
  letter-spacing:2.5px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--sky-bright),var(--leaf-bright));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.top-brand em{font-style:normal;-webkit-text-fill-color:var(--text-dim);color:var(--text-dim)}

.top-search{flex:1;max-width:380px;position:relative}
.top-search input{
  width:100%;background:var(--glass-bg);
  border:1px solid var(--glass-border);border-radius:var(--r);
  padding:7px 14px 7px 34px;color:var(--text-bright);
  font-family:var(--f-body);font-size:12.5px;outline:none;
  transition:all .25s;backdrop-filter:blur(8px);
}
.top-search input:focus{border-color:var(--glass-border-hover);box-shadow:var(--sh-glow-sky)}
.top-search input::placeholder{color:var(--text-ghost)}
.top-search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);width:15px;height:15px}

.top-fill{flex:1}

.top-right{display:flex;align-items:center;gap:10px}

.agent-pill{
  display:flex;align-items:center;gap:5px;
  font-family:var(--f-mono);font-size:10px;color:var(--text-dim);
  background:var(--glass-bg);border:1px solid var(--glass-border);
  border-radius:20px;padding:4px 10px 4px 8px;
}
.agent-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--leaf-vivid)}

.vbtn{
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--bloom-violet-glow);
  background:var(--glass-bg);color:var(--bloom-violet);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .3s;backdrop-filter:blur(8px);
}
.vbtn:hover{border-color:var(--bloom-violet);box-shadow:0 0 20px rgba(167,139,250,0.2)}
/* Live feedback while recording. A finite iteration count, never an endless
   loop: the motion governor cannot reach an iframe, so a loop here could
   never be frozen at idle. */
.vbtn.rec{border-color:var(--bloom-rose);color:var(--bloom-rose);animation:vpulse 1.2s 250}
@keyframes vpulse{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,0.3)}50%{box-shadow:0 0 0 10px transparent}}

.tbtn{
  width:34px;height:34px;border-radius:var(--r-sm);
  border:1px solid var(--glass-border);background:var(--glass-bg);
  color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;position:relative;backdrop-filter:blur(8px);
}
.tbtn:hover{border-color:var(--glass-border-hover);color:var(--sky-bright)}
.badge{
  position:absolute;top:-3px;right:-3px;width:15px;height:15px;
  border-radius:50%;background:var(--bloom-rose);font-size:8.5px;
  font-weight:700;color:white;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(251,113,133,0.4);
}

.fam-row{display:flex;gap:3px;margin-left:6px}
.fav{
  width:30px;height:30px;border-radius:50%;
  border:2px solid var(--ocean-deep);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;cursor:pointer;transition:all .2s;
}
.fav:hover{transform:scale(1.18);z-index:5}
.fav.on{border-color:currentColor;box-shadow:0 0 12px currentColor}

/* ── MAIN AREA ───────────────────────────────────────────── */
.main{
  padding:18px 22px;overflow-y:auto;
  max-height:calc(100vh - 56px);
  position:relative;
}

/* ── TILE GRID (DRAGGABLE) ───────────────────────────────── */
.tile-grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:var(--gap);
  grid-auto-rows:minmax(60px,auto);
}

/* ── GLASS TILE ──────────────────────────────────────────── */
.tile{
  background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);
  border-radius:var(--r-lg);
  overflow:hidden;
  display:flex;flex-direction:column;
  transition:box-shadow .3s,border-color .3s,transform .15s;
  position:relative;
}
.tile:hover{
  border-color:var(--glass-border-hover);
  box-shadow:var(--sh-md),var(--sh-glow-sky);
}

/* Glass shine overlay - Frutiger Aero signature */
.tile::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.03) 0%,transparent 50%);
  pointer-events:none;border-radius:var(--r-lg);z-index:1;
}

/* ── DRAG HANDLE ─────────────────────────────────────────── */
.tile-drag{
  position:absolute;top:8px;right:8px;z-index:10;
  width:24px;height:24px;border-radius:6px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.06);
  cursor:grab;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;color:var(--text-ghost);font-size:10px;
}
.tile:hover .tile-drag{opacity:1}
.tile-drag:active{cursor:grabbing;background:var(--sky-glow)}
.tile.dragging{
  opacity:0.7;transform:scale(1.02)rotate(1deg);
  box-shadow:var(--sh-lg),var(--sh-glow-sky);z-index:100;
}
.tile.drop-target{
  border-color:var(--sky-bright);
  box-shadow:0 0 0 2px var(--sky-glow),var(--sh-glow-sky);
}

/* ── TILE HEADER ─────────────────────────────────────────── */
.th{
  padding:14px 18px 10px;display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.04);position:relative;z-index:2;
}
.th-ico{
  width:30px;height:30px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;font-size:15px;
}
.th-ico.sky{background:var(--sky-glow);color:var(--sky-bright)}
.th-ico.leaf{background:var(--leaf-glow);color:var(--leaf-bright)}
.th-ico.sun{background:var(--sun-glow);color:var(--sun-bright)}
.th-ico.rose{background:var(--bloom-rose-glow);color:var(--bloom-rose)}
.th-ico.violet{background:var(--bloom-violet-glow);color:var(--bloom-violet)}
.th-ico.aqua{background:var(--bloom-aqua-glow);color:var(--bloom-aqua)}

.th-title{
  font-family:var(--f-display);font-size:11.5px;font-weight:600;
  letter-spacing:1.8px;text-transform:uppercase;flex:1;
}

.th-act{
  background:none;border:1px solid var(--glass-border);
  color:var(--text-dim);border-radius:6px;padding:4px 10px;
  font-family:var(--f-body);font-size:10.5px;cursor:pointer;
  transition:all .2s;
}
.th-act:hover{border-color:var(--sky-glow);color:var(--sky-bright)}

/* ── TILE BODY ───────────────────────────────────────────── */
.tb{
  padding:12px 18px 16px;flex:1;overflow-y:auto;
  position:relative;z-index:2;max-height:450px;
}

/* ── STAT CARDS ──────────────────────────────────────────── */
.stat-row{grid-column:span 12;display:grid;grid-template-columns:repeat(5,1fr);gap:var(--gap)}

.stat{
  background:var(--glass-bg);backdrop-filter:blur(var(--glass-blur));
  border:1px solid var(--glass-border);border-radius:var(--r);
  padding:16px 18px;position:relative;overflow:hidden;transition:all .3s;
}
.stat:hover{border-color:var(--glass-border-hover);transform:translateY(-2px);box-shadow:var(--sh-md)}
.stat::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
}
.stat.sky::after{background:linear-gradient(90deg,var(--sky-bright),transparent)}
.stat.leaf::after{background:linear-gradient(90deg,var(--leaf-bright),transparent)}
.stat.sun::after{background:linear-gradient(90deg,var(--sun-bright),transparent)}
.stat.rose::after{background:linear-gradient(90deg,var(--bloom-rose),transparent)}
.stat.violet::after{background:linear-gradient(90deg,var(--bloom-violet),transparent)}

/* Bubble decoration - Frutiger Aero */
.stat::before{
  content:'';position:absolute;right:-10px;bottom:-10px;
  width:60px;height:60px;border-radius:50%;
  border:1px solid rgba(255,255,255,0.04);
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.03),transparent);
  pointer-events:none;
}

.stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:6px}
.stat-val{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.stat.sky .stat-val{color:var(--sky-bright)}
.stat.leaf .stat-val{color:var(--leaf-bright)}
.stat.sun .stat-val{color:var(--sun-bright)}
.stat.rose .stat-val{color:var(--bloom-rose)}
.stat.violet .stat-val{color:var(--bloom-violet)}
.stat-sub{font-family:var(--f-mono);font-size:10px;color:var(--text-dim);margin-top:5px}

/* ── CALENDAR ────────────────────────────────────────────── */
.cal-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px}
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-btn{
  width:28px;height:28px;border-radius:6px;border:1px solid var(--glass-border);
  background:var(--glass-bg);color:var(--text-dim);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.cal-btn:hover{border-color:var(--sky-glow);color:var(--sky-bright)}
.cal-mo{font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:1px}

.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dh{
  text-align:center;font-family:var(--f-mono);font-size:9.5px;font-weight:500;
  color:var(--text-ghost);text-transform:uppercase;letter-spacing:1.5px;padding:6px 0;
}
.cal-d{
  aspect-ratio:1.35;border-radius:var(--r-sm);padding:4px;
  cursor:pointer;transition:all .15s;display:flex;flex-direction:column;
  min-height:58px;position:relative;
}
.cal-d:hover{background:rgba(56,189,248,0.04)}
.cal-d.om{opacity:.2}
.cal-d.today{
  background:var(--sky-glow);border:1px solid rgba(56,189,248,0.2);
  box-shadow:inset 0 0 16px rgba(56,189,248,0.05);
}
.cal-d.sel{background:var(--bloom-violet-glow);border:1px solid rgba(167,139,250,0.25)}
.cal-dn{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--text-dim);margin-bottom:3px}
.cal-d.today .cal-dn{color:var(--sky-bright);font-weight:700}
.cal-evts{display:flex;flex-direction:column;gap:1px;flex:1;overflow:hidden}
.cal-pill{
  font-size:8.5px;font-weight:600;padding:1px 4px;border-radius:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;
}

/* ── SCHEDULE LIST ───────────────────────────────────────── */
.sch{
  display:flex;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,0.03);
  transition:all .2s;cursor:pointer;
}
.sch:hover{padding-left:4px}
.sch:last-child{border-bottom:none}
.sch-time{font-family:var(--f-mono);font-size:10.5px;color:var(--text-ghost);min-width:48px;padding-top:2px}
.sch-bar{width:3px;border-radius:2px;flex-shrink:0}
.sch-body{flex:1;min-width:0}
.sch-name{font-weight:600;font-size:12.5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sch-meta{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{
  font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  padding:2px 6px;border-radius:4px;
}

/* ── TASKS ────────────────────────────────────────────────── */
.tsk{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.tsk:last-child{border-bottom:none}
.tsk-chk{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--text-ghost);
  cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;
  justify-content:center;margin-top:1px;
}
.tsk-chk:hover{border-color:var(--leaf-vivid)}
.tsk-chk.done{background:var(--leaf-vivid);border-color:var(--leaf-vivid)}
.tsk-chk.done::after{content:'✓';font-size:10px;color:white;font-weight:700}
.tsk-body{flex:1;min-width:0}
.tsk-name{font-weight:500;font-size:12.5px;margin-bottom:2px}
.tsk.fin .tsk-name{text-decoration:line-through;color:var(--text-ghost)}
.tsk-info{font-size:10.5px;color:var(--text-dim);display:flex;align-items:center;gap:7px}
.prio{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prio.urgent{background:var(--bloom-rose);box-shadow:0 0 6px var(--bloom-rose-glow)}
.prio.high{background:var(--sun-bright);box-shadow:0 0 6px var(--sun-glow)}
.prio.medium{background:var(--sky-vivid)}
.prio.low{background:var(--text-ghost)}

/* ── MEDICATIONS ─────────────────────────────────────────── */
.med{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.med:last-child{border-bottom:none}
.med-ico{
  width:32px;height:32px;border-radius:var(--r-sm);
  background:var(--leaf-glow);color:var(--leaf-bright);
  display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;
}
.med-body{flex:1}
.med-nm{font-weight:600;font-size:12.5px;margin-bottom:1px}
.med-dose{font-family:var(--f-mono);font-size:10.5px;color:var(--text-dim)}
.med-st{
  font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:6px;
  text-transform:uppercase;letter-spacing:.5px;cursor:pointer;transition:all .2s;
}
.med-st:hover{transform:scale(1.05)}
.med-st.due{background:var(--sun-glow);color:var(--sun-bright)}
.med-st.taken{background:var(--leaf-glow);color:var(--leaf-bright)}
.med-st.overdue{background:var(--bloom-rose-glow);color:var(--bloom-rose)}

/* ── BILLS ───────────────────────────────────────────────── */
.bill{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.bill:last-child{border-bottom:none}
.bill-ico{

}
.bill-body{flex:1}
.bill-nm{font-weight:600;font-size:12.5px;margin-bottom:1px}
.bill-due{font-family:var(--f-mono);font-size:10.5px;color:var(--text-dim)}
.bill-amt{font-family:var(--f-display);font-weight:700;font-size:13.5px;color:var(--sun-bright)}

/* ── SOURCE BADGES ───────────────────────────────────────── */
.src{
  display:inline-flex;align-items:center;gap:3px;
  font-size:8.5px;font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;padding:2px 5px;border-radius:4px;
}
.src-voice{background:var(--bloom-violet-glow);color:var(--bloom-violet)}
.src-manual{background:var(--sky-glow);color:var(--sky-bright)}
.src-email{background:var(--sun-glow);color:var(--sun-bright)}
.src-message{background:var(--leaf-glow);color:var(--leaf-bright)}
.src-import{background:var(--bloom-aqua-glow);color:var(--bloom-aqua)}

/* ── MODAL ───────────────────────────────────────────────── */
.overlay{
  position:fixed;inset:0;background:rgba(4,10,20,0.85);
  backdrop-filter:blur(12px);z-index:1000;
  display:none;align-items:center;justify-content:center;
}
.overlay.on{display:flex}
.modal{
  background:var(--ocean-mid);border:1px solid var(--glass-border);
  border-radius:var(--r-xl);width:95%;max-width:520px;
  box-shadow:var(--sh-lg),var(--sh-glow-sky);
  animation:mIn .3s ease;
}
@keyframes mIn{from{opacity:0;transform:scale(.96)translateY(8px)}to{opacity:1;transform:none}}
.m-head{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:space-between}
.m-title{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:1px}
.m-x{
  background:none;border:none;color:var(--text-ghost);font-size:20px;
  cursor:pointer;width:30px;height:30px;border-radius:var(--r-sm);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.m-x:hover{background:rgba(255,255,255,0.04);color:var(--text-bright)}
.m-body{padding:20px 22px}

.fg{margin-bottom:15px}
.fl{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-ghost);margin-bottom:5px}
.fi{
  width:100%;background:var(--ocean-deep);border:1px solid var(--glass-border);
  border-radius:var(--r-sm);padding:9px 12px;color:var(--text-bright);
  font-family:var(--f-body);font-size:12.5px;outline:none;transition:all .2s;
}
.fi:focus{border-color:var(--glass-border-hover);box-shadow:0 0 0 3px var(--sky-ghost)}
.fi::placeholder{color:var(--text-ghost)}
select.fi{appearance:none;cursor:pointer}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  padding:5px 12px;border-radius:18px;border:1px solid var(--glass-border);
  background:var(--glass-bg);font-size:11.5px;cursor:pointer;
  transition:all .2s;color:var(--text-dim);
}
.chip:hover{border-color:var(--sky-glow)}
.chip.on{background:var(--sky-glow);border-color:rgba(56,189,248,0.3);color:var(--sky-bright)}

.m-foot{padding:14px 22px;border-top:1px solid rgba(255,255,255,0.04);display:flex;gap:8px;justify-content:flex-end}

.btn{
  padding:8px 20px;border-radius:var(--r-sm);font-family:var(--f-body);
  font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s;border:none;
}
.btn-p{
  background:linear-gradient(135deg,var(--sky-vivid),var(--leaf-deep));
  color:white;box-shadow:0 2px 12px rgba(14,165,233,0.2);
}
.btn-p:hover{transform:translateY(-1px);box-shadow:var(--sh-glow-sky)}
.btn-g{background:transparent;border:1px solid var(--glass-border);color:var(--text-dim)}
.btn-g:hover{border-color:var(--text-ghost);color:var(--text-bright)}

/* ── TILE ANIMATIONS ─────────────────────────────────────── */
.tile{animation:tileIn .5s ease backwards}
.tile:nth-child(1){animation-delay:.05s}
.tile:nth-child(2){animation-delay:.1s}
.tile:nth-child(3){animation-delay:.15s}
.tile:nth-child(4){animation-delay:.2s}
.tile:nth-child(5){animation-delay:.25s}
.tile:nth-child(6){animation-delay:.3s}
@keyframes tileIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ── RESPONSIVE ──────────────────────────────────────────── */
@media(max-width:1100px){
  .stat-row{grid-template-columns:repeat(3,1fr)}
  .tile-grid{grid-template-columns:repeat(6,1fr)}
}
@media(max-width:768px){

  .side{
    grid-row:2;flex-direction:row;padding:0 8px;height:48px;

  }

  .nfill{display:none}
  .tile-grid{grid-template-columns:1fr}
  .stat-row{grid-template-columns:repeat(2,1fr)}
}

<script>
// ════════════════════════════════════════════════════════════════════════════
// PuffPAI Calendar v2
// Frutiger Aero × Next-Gen AI · Draggable Tiles · Local-First
// ════════════════════════════════════════════════════════════════════════════

const D = {
  // ── FAMILY ──
  family: [
    {id:'dad',name:'Adult 1',color:'#38bdf8',emoji:'👤',role:'parent'},
    {id:'mom',name:'Adult 2',color:'#a78bfa',emoji:'👤',role:'parent'},
    {id:'kid1',name:'Kid 1',color:'#4ade80',emoji:'👤',role:'child'},
    {id:'kid2',name:'Kid 2',color:'#fbbf24',emoji:'👤',role:'child'},
  ],

  // ── EVENTS ──
  events: [],

  // ── TASKS ──
  tasks: [],

  // ── MEDS ──
  meds: [],

  // ── BILLS ──
  bills: [],

  // ── TILE ORDER ──
  tileOrder: ['stats','calendar','schedule','tasks','meds','bills'],

  filter: 'all',
};

// ── SAMPLE DATA ────────────────────────────────────────────────────────
// A first-run illustration of the layout, and nothing else. It runs ONLY when
// PuffPAI answered and its calendar document is genuinely empty, it is never
// pushed, and it is labelled on screen. Its previous content was fabricated
// household record — a prescription with dosing instructions, a housing
// payment, a school form for a named child — which the sync path wrote into
// the real calendar on first load, where the voice surface would have read it
// aloud as fact.
function seed() {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth(), d = t.getDate();
  const dt = (dd,h=9,mm=0) => new Date(y,m,d+dd,h,mm);
  D.isSample = true;

  D.events = [
    {id:'e1',title:'Sample event',cat:'family',start:dt(0,16),end:dt(0,17),to:'all',prio:'medium',src:'manual',sample:true},
    {id:'e2',title:'Sample event — all day tomorrow',cat:'other',start:dt(1,9),end:dt(1,17),to:'all',prio:'low',src:'manual',sample:true},
    {id:'e3',title:'Sample event — next week',cat:'other',start:dt(6,10),end:dt(6,11),to:'all',prio:'low',src:'manual',sample:true},
  ];

  D.tasks = [
    {id:'t1',title:'Sample task',cat:'other',due:dt(1),to:'all',prio:'medium',status:'pending',src:'manual',sample:true},
    {id:'t2',title:'Sample task — already done',cat:'other',due:dt(0),to:'all',prio:'low',status:'completed',src:'manual',sample:true},
  ];

  // Deliberately empty. A medication list is the one place on this screen
  // where an invented row could be acted on, so there is no sample for it.
  D.meds = [];

  D.bills = [
    {id:'b1',name:'Sample bill',amt:0,due:dt(5),cat:'other',status:'pending',auto:false,sample:true},
  ];

  showSampleBanner();

  // Load saved tile order
  try {
    const saved = localStorage.getItem('puffpai_tile_order');
    if (saved) D.tileOrder = JSON.parse(saved);
  } catch(e) {}
}

// ── SAMPLE-DATA LIFECYCLE ──────────────────────────────────────────────
// Sample rows are tagged `sample:true` and never leave the browser. The first
// action that would write to the household store clears them first, so what
// gets pushed is only ever what a person actually entered.
function showSampleBanner() {
  if (document.getElementById('sampleBanner')) return;
  const bar = document.createElement('div');
  bar.id = 'sampleBanner';
  bar.textContent = 'Sample data \u2014 none of this is real, none of it is '
    + 'saved to your household, and it disappears as soon as you add '
    + 'something of your own.';
  bar.style.cssText = 'position:relative;z-index:9999;padding:10px 16px;'
    + 'font:600 13px/1.4 system-ui,sans-serif;color:#1b1b1b;'
    + 'background:#ffd479;border-bottom:1px solid rgba(0,0,0,.2);'
    + 'text-align:center';
  document.body.prepend(bar);
}

function clearSampleData() {
  if (!D.isSample) return;
  D.isSample = false;
  D.events = (D.events || []).filter(x => !x.sample);
  D.tasks = (D.tasks || []).filter(x => !x.sample);
  D.meds = (D.meds || []).filter(x => !x.sample);
  D.bills = (D.bills || []).filter(x => !x.sample);
  const bar = document.getElementById('sampleBanner');
  if (bar) bar.remove();
}

// ── HELPERS ────────────────────────────────────────────────────────────
const CAT_CLR = {medical:'rose',sports:'leaf',school:'violet',bills:'sun',family:'sky',work:'aqua',prescription:'rose',appointment:'sun',other:'sky'};
const SRC_LBL = {voice:'🎤 Voice',manual:'✏️ Manual',email:'📧 Email',message:'💬 Msg',import:'📥 Import'};
const SRC_CLS = {voice:'src-voice',manual:'src-manual',email:'src-email',message:'src-message',import:'src-import'};
const esc = s => {const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const ftime = d => d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
const fdate = d => d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const daysTo = d => {const n=new Date();n.setHours(0,0,0,0);const t=new Date(d);t.setHours(0,0,0,0);return Math.ceil((t-n)/864e5)};
const getMem = id => id==='all'?{name:'Everyone',color:'#38bdf8',emoji:'👨‍👩‍👧‍👦'}:D.family.find(f=>f.id===id)||{name:'?',color:'#888',emoji:'?'};

// ── Recurring Event Expansion ──
function expandRecurring(events, rangeStart, rangeEnd) {
  const out = [];
  events.forEach(e => {
    if (!e.rec || e.rec === 'none') { out.push(e); return; }
    // Generate occurrences within range
    const orig = new Date(e.start);
    const dur = e.end ? (new Date(e.end) - orig) : 3600000;
    let cur = new Date(orig);
    while (cur <= rangeEnd) {
      if (cur >= rangeStart || cur.toDateString() === rangeStart.toDateString()) {
        const occ = { ...e, start: new Date(cur), end: new Date(cur.getTime() + dur), _recurring: true, _origId: e.id };
        out.push(occ);
      }
      if (e.rec === 'daily') cur.setDate(cur.getDate() + 1);
      else if (e.rec === 'weekly') cur.setDate(cur.getDate() + 7);
      else if (e.rec === 'monthly') cur.setMonth(cur.getMonth() + 1);
      else break;
      if (out.length > 500) break; // safety
    }
  });
  return out;
}

let calMonth = new Date().getMonth(), calYear = new Date().getFullYear();

// ════════════════════════════════════════════════════════════════════════
// DRAG & DROP TILE SYSTEM
// ════════════════════════════════════════════════════════════════════════
const Drag = (() => {
  let dragged = null;
  let dragId = null;

  function init() {
    document.addEventListener('dragstart', e => {
      const tile = e.target.closest('.tile[data-tile-id]');
      if (!tile) return;
      dragId = tile.dataset.tileId;
      dragged = tile;
      tile.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', dragId);
    });

    document.addEventListener('dragend', e => {
      if (dragged) dragged.classList.remove('dragging');
      document.querySelectorAll('.tile.drop-target').forEach(t => t.classList.remove('drop-target'));
      dragged = null;
      dragId = null;
    });

    document.addEventListener('dragover', e => {
      e.preventDefault();
      const tile = e.target.closest('.tile[data-tile-id]');
      if (tile && tile.dataset.tileId !== dragId) {
        document.querySelectorAll('.tile.drop-target').forEach(t => t.classList.remove('drop-target'));
        tile.classList.add('drop-target');
      }
    });

    document.addEventListener('dragleave', e => {
      const tile = e.target.closest('.tile[data-tile-id]');
      if (tile) tile.classList.remove('drop-target');
    });

    document.addEventListener('drop', e => {
      e.preventDefault();
      const target = e.target.closest('.tile[data-tile-id]');
      if (!target || !dragId || target.dataset.tileId === dragId) return;

      const fromIdx = D.tileOrder.indexOf(dragId);
      const toIdx = D.tileOrder.indexOf(target.dataset.tileId);
      if (fromIdx === -1 || toIdx === -1) return;

      // Swap positions
      D.tileOrder.splice(fromIdx, 1);
      D.tileOrder.splice(toIdx, 0, dragId);

      // Save and re-render
      localStorage.setItem('puffpai_tile_order', JSON.stringify(D.tileOrder));
      UI.render();
    });
  }

  return { init };
})();

// ════════════════════════════════════════════════════════════════════════
// UI RENDERER
// ════════════════════════════════════════════════════════════════════════
const UI = (() => {
  function render() {
    renderFam();
    renderMain();
  }

  function renderFam() {
    document.getElementById('famAvatars').innerHTML = D.family.map(f =>
      `<div class="fav ${D.filter===f.id?'on':''}" style="background:${f.color}18;color:${f.color}" onclick="UI.filterMem('${f.id}')" title="${f.name}">${f.emoji}</div>`
    ).join('');
  }

  function filterMem(id) {
    D.filter = D.filter===id ? 'all' : id;
    renderFam();
    renderMain();
  }

  function renderMain() {
    const today = new Date();
    const todayStart = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    const todayEnd = new Date(todayStart.getTime() + 864e5);
    const allToday = expandRecurring(D.events, todayStart, todayEnd);
    const todayEvts = allToday.filter(e => e.start.toDateString()===today.toDateString()).sort((a,b)=>a.start-b.start);
    const pendTasks = D.tasks.filter(t => t.status!=='completed');
    const urgTasks = pendTasks.filter(t => t.prio==='urgent'||t.prio==='high');
    const dueMeds = D.meds.filter(m => m.status!=='taken');
    const upBills = D.bills.filter(b => b.status==='pending').sort((a,b)=>a.due-b.due);
    const totalBills = upBills.reduce((s,b)=>s+b.amt,0);

    // Build tile content map
    const tiles = {
      stats: renderStats(todayEvts, pendTasks, urgTasks, dueMeds, upBills, totalBills, today),
      calendar: renderCalTile(),
      schedule: renderScheduleTile(todayEvts),
      tasks: renderTasksTile(pendTasks),
      meds: renderMedsTile(),
      bills: renderBillsTile(upBills),
    };

    // Grid column spans
    const spans = {
      stats: 'grid-column:1/-1',
      calendar: 'grid-column:span 8',
      schedule: 'grid-column:span 4',
      tasks: 'grid-column:span 4',
      meds: 'grid-column:span 4',
      bills: 'grid-column:span 4',
    };

    document.getElementById('mainArea').innerHTML = `<div class="tile-grid">${
      D.tileOrder.map(id => {
        if (id === 'stats') return `<div class="stat-row" data-tile-id="stats" draggable="true">${tiles.stats}</div>`;
        return `<div class="tile" data-tile-id="${id}" style="${spans[id]||''}" draggable="true">
          <div class="tile-drag" title="Drag to rearrange">⠿</div>
          ${tiles[id]||''}
        </div>`;
      }).join('')
    }</div>`;
  }

  // ── STATS ROW ──
  function renderStats(todayEvts, pendTasks, urgTasks, dueMeds, upBills, totalBills, today) {
    return `
      <div class="stat sky"><div class="stat-lbl">Today's Events</div><div class="stat-val">${todayEvts.length}</div><div class="stat-sub">${fdate(today)}</div></div>
      <div class="stat violet"><div class="stat-lbl">Pending Tasks</div><div class="stat-val">${pendTasks.length}</div><div class="stat-sub">${urgTasks.length} urgent</div></div>
      <div class="stat leaf"><div class="stat-lbl">Medications</div><div class="stat-val">${dueMeds.length}</div><div class="stat-sub">${dueMeds.length?'doses remaining':'all taken ✓'}</div></div>
      <div class="stat sun"><div class="stat-lbl">Bills Due</div><div class="stat-val">${upBills.length}</div><div class="stat-sub">$${totalBills.toLocaleString('en-US',{minimumFractionDigits:2})}</div></div>
      <div class="stat rose"><div class="stat-lbl">Alerts</div><div class="stat-val">${urgTasks.length+dueMeds.length}</div><div class="stat-sub">need attention</div></div>
    `;

  // ── CALENDAR TILE ──
  function renderCalTile() {
    const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
    const first=new Date(calYear,calMonth,1).getDay();
    const dim=new Date(calYear,calMonth+1,0).getDate();
    const prevDim=new Date(calYear,calMonth,0).getDate();
    const today=new Date();

    let grid='';
    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d=>{grid+=`<div class="cal-dh">${d}</div>`});

    for(let i=first-1;i>=0;i--) grid+=`<div class="cal-d om"><div class="cal-dn">${prevDim-i}</div></div>`;

    const moStart=new Date(calYear,calMonth,1);
    const moEnd=new Date(calYear,calMonth+1,0,23,59,59);
    const moEvents=expandRecurring(D.events,moStart,moEnd);

    for(let dd=1;dd<=dim;dd++){
      const date=new Date(calYear,calMonth,dd);
      const isT=date.toDateString()===today.toDateString();
      const dayEvts=moEvents.filter(e=>e.start.toDateString()===date.toDateString());
      grid+=`<div class="cal-d${isT?' today':''}" onclick="UI.selDate(${calYear},${calMonth},${dd})">
        <div class="cal-dn">${dd}</div><div class="cal-evts">${
          dayEvts.slice(0,3).map(e=>{
            const c=CAT_CLR[e.cat]||'sky';
            const cv={'sky':'--sky-glow','leaf':'--leaf-glow','sun':'--sun-glow','rose':'--bloom-rose-glow','violet':'--bloom-violet-glow','aqua':'--bloom-aqua-glow'};
            const ct={'sky':'--sky-bright','leaf':'--leaf-bright','sun':'--sun-bright','rose':'--bloom-rose','violet':'--bloom-violet','aqua':'--bloom-aqua'};
            return `<div class="cal-pill" style="background:var(${cv[c]});color:var(${ct[c]})">${esc(e.title)}</div>`;
          }).join('')
        }${dayEvts.length>3?`<div style="font-size:8px;color:var(--text-ghost)">+${dayEvts.length-3}</div>`:''}</div></div>`;
    }

    const rem=(first+dim)%7;
    const fill=rem===0?0:7-rem;
    for(let i=1;i<=fill;i++) grid+=`<div class="cal-d om"><div class="cal-dn">${i}</div></div>`;

    return `
      <div class="th"><div class="th-ico sky">📅</div><span class="th-title">Calendar</span><button class="th-act" onclick="UI.openModal()">+ Add</button></div>
      <div class="tb">
        <div class="cal-head">
          <div class="cal-nav">
            <button class="cal-btn" onclick="UI.prevMo()">‹</button>
            <span class="cal-mo">${MN[calMonth]} ${calYear}</span>
            <button class="cal-btn" onclick="UI.nextMo()">›</button>
          </div>
        </div>
        <div class="cal-g">${grid}</div>
      </div>`;

          const bgv={'sky':'--sky-glow','leaf':'--leaf-glow','sun':'--sun-glow','rose':'--bloom-rose-glow','violet':'--bloom-violet-glow','aqua':'--bloom-aqua-glow'};

  // ── TASKS TILE ──
  function renderTasksTile(pending) {

      <div class="th"><div class="th-ico leaf">✓</div><span class="th-title">Tasks</span><button class="th-act" onclick="UI.openModal('task')">+ Add</button></div>
      <div class="tb">${sorted.map(t=>{
        const mem=getMem(t.to);const days=daysTo(t.due);

        return `<div class="tsk ${t.status==='completed'?'fin':''}">

            <div class="tsk-name">${esc(t.title)}</div>

              <span style="color:${days<0?'var(--bloom-rose)':days<=1?'var(--sun-bright)':'var(--text-dim)'}">${dl}</span>

  // ── MEDS TILE ──
  function renderMedsTile() {
    return `
      <div class="th"><div class="th-ico rose">💊</div><span class="th-title">Medications</span></div>
      <div class="tb">${D.meds.map(m=>{
        const mem=getMem(m.to);const rd=daysTo(m.refill);
        return `<div class="med">
          <div class="med-ico">💊</div>
          <div class="med-body">
            <div class="med-nm">${esc(m.name)}</div>

        </div>`;

  // ── BILLS TILE ──
  function renderBillsTile(bills) {
    const icons={utilities:'⚡',insurance:'🛡️',subscription:'📺',housing:'🏠'};
    return `
      <div class="th"><div class="th-ico sun">💳</div><span class="th-title">Bills</span></div>
      <div class="tb">${bills.slice(0,6).map(b=>{
        const days=daysTo(b.due);
        const dl=days===0?'Due Today':days===1?'Tomorrow':days<0?'Overdue!':days+'d';
        return `<div class="bill">
          <div class="bill-ico" style="background:var(--sun-glow);color:var(--sun-bright)">${icons[b.cat]||'💰'}</div>
          <div class="bill-body">
            <div class="bill-nm">${esc(b.name)}${b.auto?' <span style="font-size:8.5px;color:var(--leaf-bright)">AUTO</span>':''}</div>
            <div class="bill-due" style="color:${days<=2?'var(--sun-bright)':'var(--text-dim)'}">${dl} · ${fdate(b.due)}</div>
          </div>
          <div class="bill-amt">$${b.amt.toFixed(2)}</div>
          <button onclick="event.stopPropagation();if(confirm('Delete?'))UI.delBill('${b.id}')" style="background:none;border:1px solid rgba(251,113,133,0.3);color:var(--bloom-rose);font-size:9px;padding:1px 6px;border-radius:4px;cursor:pointer;margin-left:6px">✕</button>
        </div>`;
      }).join('')}</div>`;
  }

  // ── ACTIONS ──
  function prevMo(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderMain()}
  function nextMo(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderMain()}
  function selDate(y,m,dd){/* future: open day detail */}
  function togTask(id){const t=D.tasks.find(x=>x.id===id);if(t){t.status=t.status==='completed'?'pending':'completed';renderMain();Sync.push()}}
  function togMed(id){const m=D.meds.find(x=>x.id===id);if(m){m.status=m.status==='taken'?'due':'taken';renderMain();Sync.push()}}
  function delEvent(id){D.events=D.events.filter(e=>e.id!==id);renderMain();Sync.push()}
  function delTask(id){D.tasks=D.tasks.filter(t=>t.id!==id);renderMain();Sync.push()}
  function delMed(id){D.meds=D.meds.filter(m=>m.id!==id);renderMain();Sync.push()}
  function delBill(id){D.bills=D.bills.filter(b=>b.id!==id);renderMain();Sync.push()}

  // ── MODAL ──
  function openModal(type='event'){
    document.getElementById('addModal').classList.add('on');
    document.getElementById('aDate').valueAsDate=new Date();
    document.querySelectorAll('#typeChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===type));
    const sel=document.getElementById('aAssign');
    sel.innerHTML='<option value="all">Everyone</option>'+D.family.map(f=>`<option value="${f.id}">${f.emoji} ${f.name}</option>`).join('');
  }
  function closeModal(){
    document.getElementById('addModal').classList.remove('on');
    document.getElementById('aTitle').value='';
    document.getElementById('aNotes').value='';
  }
  function saveEntry(){
    const title=document.getElementById('aTitle').value.trim();
    if(!title)return;
    const type=document.querySelector('#typeChips .chip.on')?.dataset.t||'event';
    const date=document.getElementById('aDate').value;
    const time=document.getElementById('aTime').value||'09:00';
    const cat=document.getElementById('aCat').value;
    const to=document.getElementById('aAssign').value;
    const prio=document.getElementById('aPrio').value;
    const rec=document.getElementById('aRec').value;
    const [h,mm]=time.split(':').map(Number);
    const s=new Date(date);s.setHours(h,mm);
    const id=type[0]+Date.now();

    if(type==='event'){const e=new Date(s);e.setHours(e.getHours()+1);D.events.push({id,title,cat,start:s,end:e,to,prio,src:'manual',rec})}
    else if(type==='task'){D.tasks.push({id,title,cat,due:s,to,prio,status:'pending',src:'manual'})}
    else if(type==='medication'){D.meds.push({id,name:title,dose:document.getElementById('aNotes').value||'As directed',to,freq:rec==='daily'?'daily':'as needed',next:time,status:'due',refill:new Date(s.getTime()+30*864e5)})}
    else if(type==='bill'){D.bills.push({id,name:title,amt:0,due:s,cat,status:'pending',auto:false})}
    closeModal();renderMain();Sync.push();
  }

  return {render,renderMain,renderFam,filterMem,prevMo,nextMo,selDate,togTask,togMed,openModal,closeModal,saveEntry,delEvent,delTask,delMed,delBill};
})();

// VOICE INPUT
// ════════════════════════════════════════════════════════════════════════
const Voice = (() => {
  let rec=null, on=false;
  function init(){
    if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window))return;
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    rec=new SR();rec.continuous=false;rec.interimResults=true;rec.lang='en-US';
    rec.onresult=e=>{
      let txt='';for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;
      document.getElementById('aTitle').value=txt;
      if(e.results[e.results.length-1].isFinal) autoCat(txt);
    };
    rec.onend=()=>{on=false;document.getElementById('voiceBtn').classList.remove('rec')};
  }
  function toggle(){
    if(!rec){init();if(!rec)return}
    if(on){rec.stop();on=false;document.getElementById('voiceBtn').classList.remove('rec')}
    else{rec.start();on=true;document.getElementById('voiceBtn').classList.add('rec');UI.openModal()}
  }
  function autoCat(t){
    const l=t.toLowerCase();const el=document.getElementById('aCat');
    if(/doctor|appointment|checkup|clinic/.test(l))el.value='medical';
    else if(/soccer|basketball|game|practice|swim/.test(l))el.value='sports';
    else if(/school|class|homework|test|exam/.test(l))el.value='school';
    else if(/bill|pay|payment|due/.test(l))el.value='bills';
    else if(/refill|prescription|medication|pharmacy/.test(l))el.value='prescription';
    if(/tomorrow/.test(l)){const d=new Date();d.setDate(d.getDate()+1);document.getElementById('aDate').valueAsDate=d}
    if(/urgent|asap|emergency/.test(l))document.getElementById('aPrio').value='urgent';
    else if(/important/.test(l))document.getElementById('aPrio').value='high';
  }
  return {init,toggle};
})();

// ════════════════════════════════════════════════════════════════════════
// PUFFPAI SYNC — Bidirectional data sync with PuffPAI API server
// ════════════════════════════════════════════════════════════════════════
const Sync = (() => {
  // Same-origin: the proxy attaches the API key server-side, so the page
  // never holds a credential and never names a host.
  const API = '/api/pai/apps/calendar';
  let lastKnown = '';

  /** Convert ISO strings back to Date objects in calendar data */
  function hydrate(data) {
    (data.events||[]).forEach(e => { e.start = new Date(e.start); e.end = new Date(e.end); });
    (data.tasks||[]).forEach(t => { if(t.due) t.due = new Date(t.due); });
    (data.meds||[]).forEach(m => { if(m.refill) m.refill = new Date(m.refill); });
    (data.bills||[]).forEach(b => { if(b.due) b.due = new Date(b.due); });
    return data;
  }

  /** Push current D to the API. Sample rows are dropped first, never sent. */
  async function push() {
    // Never before we have read the household document: on an offline first
    // load D holds empty arrays, and pushing those would erase the calendar
    // the moment the server came back.
    if (!haveRead) return;
    clearSampleData();
    UI.render();
    try {
      // Every push here follows a user gesture on their own calendar, so a
      // shrink is meant. Keys we omit are preserved server-side regardless.
      const r = await fetch(API + '/data?allow_shrink=1', {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          family: D.family,
          events: D.events,
          tasks: D.tasks,
          meds: D.meds,
          bills: D.bills
        })
      });
      if (r.ok) {
        const body = await r.json();
        // Update our timestamp so we don't re-pull our own push
        lastKnown = new Date().toISOString();
      }
    } catch(e) { console.warn('[Sync] push failed:', e); }
  }

  /** Pull data from API and refresh UI if newer */
  async function pull() {
    try {
      // Check if anything changed
      const chk = await fetch(API + '/updated');
      if (!chk.ok) return;
      const {last_updated} = await chk.json();
      if (!last_updated || last_updated === lastKnown) return;

      // Fetch full data
      const r = await fetch(API + '/data');
      if (!r.ok) return;
      const data = await r.json();
      lastKnown = last_updated;

      // Merge into D
      if (data.family && data.family.length) D.family = data.family;
      if (data.events) D.events = hydrate({events:data.events}).events;
      if (data.tasks) D.tasks = hydrate({tasks:data.tasks}).tasks;
      if (data.meds) D.meds = hydrate({meds:data.meds}).meds;
      if (data.bills) D.bills = hydrate({bills:data.bills}).bills;

      haveRead = true;
      UI.render();
      console.log('[Sync] pulled update from PuffPAI');
    } catch(e) { /* server offline, ignore */ }
  }

  //: set once a GET has actually returned the household document.
  let haveRead = false;

  /** Load initial data. Returns 'loaded' (the household has data), 'empty'
   *  (PuffPAI answered and has nothing) or 'offline' (we could not ask, so we
   *  do NOT know the store is empty and must not pretend otherwise). */
  async function boot() {
    try {
      const r = await fetch(API + '/data');
      if (r.ok) {
        const data = await r.json();
        // If server has real data (not just defaults with empty arrays)
        const hasData = (data.events && data.events.length) ||
                        (data.tasks && data.tasks.length) ||
                        (data.meds && data.meds.length) ||
                        (data.bills && data.bills.length);
        if (hasData) {
          if (data.family && data.family.length) D.family = data.family;
          D.events = []; D.tasks = []; D.meds = []; D.bills = [];
          hydrate(data);
          D.events = data.events || [];
          D.tasks = data.tasks || [];
          D.meds = data.meds || [];
          D.bills = data.bills || [];
          lastKnown = data.last_updated || '';
          haveRead = true;
          console.log('[Sync] loaded data from PuffPAI API');
          return 'loaded';
        }
        haveRead = true;
        return 'empty';
      }
    } catch(e) { console.warn('[Sync] API unavailable'); }
    return 'offline';
  }

  /** Start polling for remote changes */
  function startPoll(interval=4000) {
    setInterval(pull, interval);
  }

  return { boot, push, pull, startPoll };
})();

// ════════════════════════════════════════════════════════════════════════
// BOOT
// ════════════════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const state = await Sync.boot();
  // Sample data only over a store we KNOW is empty, and it is never pushed.
  if (state === 'empty') seed();
  Drag.init();
  Voice.init();
  UI.render();
  Sync.startPoll();

  // Nav
  document.querySelectorAll('.nbtn[data-v]').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.nbtn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');UI.renderMain();
  }));

  // Modal triggers
  document.getElementById('addBtn').addEventListener('click',()=>UI.openModal());
  document.getElementById('voiceBtn').addEventListener('click',()=>Voice.toggle());

  // Chips
  document.querySelectorAll('#typeChips .chip').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('#typeChips .chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
  }));

  // Close modal
  document.getElementById('addModal').addEventListener('click',e=>{if(e.target===document.getElementById('addModal'))UI.closeModal()});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape')UI.closeModal();
    if(e.key==='n'&&(e.ctrlKey||e.metaKey)){e.preventDefault();UI.openModal()}
  });

  // ── NOTIFICATIONS ──
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
  // Check every 60s for upcoming events in next 15 min
  const _notified = new Set();
  setInterval(() => {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = new Date();
    const soon = new Date(now.getTime() + 15 * 60000);
    const upcoming = expandRecurring(D.events, now, soon);
    upcoming.forEach(e => {
      const key = (e._origId || e.id) + ':' + e.start.toISOString();
      if (_notified.has(key)) return;
      const diff = Math.round((e.start - now) / 60000);
      if (diff >= 0 && diff <= 15) {
        _notified.add(key);
        new Notification('PuffPAI Calendar', { body: `${e.title} in ${diff} min`, icon: '📅' });
      }
    });
    // Also check medication reminders
    D.meds.filter(m => m.status === 'due').forEach(m => {
      const key = 'med:' + m.id + ':' + now.toDateString();
      if (_notified.has(key)) return;
      _notified.add(key);
      new Notification('PuffPAI Calendar', { body: `💊 ${m.name} - ${m.dose}`, icon: '💊' });
    });
  }, 60000);
});
</script>
</body>
</html>
